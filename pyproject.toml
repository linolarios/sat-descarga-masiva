[project]
name = "sat-descarga-masiva"
version = "0.1.0"
description = "Hexagonal Python client for the SAT (Mexico) Descarga Masiva SOAP web service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cryptography>=42.0", "lxml>=5.0", "signxml>=4.0", "requests>=2.31", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-mock>=3.12", "responses>=0.25",
       "freezegun>=1.4", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/sat_descarga_masiva"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]   # tests intentionally import not-yet-built symbols (TDD)

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: hits the live SAT (needs FIEL de pruebas); off by default"]
[tool.coverage.run]
source = ["sat_descarga_masiva"]
